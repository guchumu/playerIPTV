name: APK Android TV

# Compila el APK en los servidores de GitHub, que ya traen el SDK de Android.
# Así no hace falta instalar Java, Node ni Android Studio en ningún ordenador.
#
# Lanzarlo a mano: pestaña Actions -> "APK Android TV" -> "Run workflow".
# El APK queda en los artefactos de la ejecución. Si se lanza con una etiqueta
# vNNN también se publica como Release descargable.
#
# La URL pública NUNCA cambia de versión:
#   https://acortador.vip/player/downloads/tv.apk
# El versionCode interno sí sube para que Android acepte la actualización.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "native/**"
      - "tools/patch_android_tv.py"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Capacitor
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Generar el proyecto Android
        working-directory: native
        run: npx cap add android

      - name: Aplicar la configuración de Android TV
        run: python3 tools/patch_android_tv.py native/android

      - name: Numerar la versión
        id: ver
        working-directory: native/android/app
        run: |
          # versionCode siempre crece (run_number). versionName usa la etiqueta
          # v1.0.3 si existe; si no, 1.0.<run>.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$NAME\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Preparar la clave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          RUTA="$RUNNER_TEMP/streambox.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUTA"
            echo "usando la clave guardada en los secretos"
            echo "generada=no" >> "$GITHUB_OUTPUT"
          else
            # Primera vez: se crea una clave y se publica para guardarla como
            # secreto. Las actualizaciones necesitan SIEMPRE la misma clave.
            keytool -genkeypair -v -keystore "$RUTA" \
              -alias streambox -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass streambox -keypass streambox \
              -dname "CN=StreamBox IPTV, OU=Casa, O=StreamBox, L=Madrid, C=ES"
            base64 -w0 "$RUTA" > "$RUNNER_TEMP/keystore-base64.txt"
            echo "clave nueva generada"
            echo "generada=si" >> "$GITHUB_OUTPUT"
          fi
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"

      - name: Compilar el APK firmado
        working-directory: native/android
        env:
          CLAVE: ${{ steps.firma.outputs.ruta }}
          CLAVE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'streambox' }}
          CLAVE_ALIAS: ${{ secrets.KEY_ALIAS || 'streambox' }}
          CLAVE_ALIAS_PASS: ${{ secrets.KEY_PASSWORD || 'streambox' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$CLAVE" \
            -Pandroid.injected.signing.store.password="$CLAVE_PASS" \
            -Pandroid.injected.signing.key.alias="$CLAVE_ALIAS" \
            -Pandroid.injected.signing.key.password="$CLAVE_ALIAS_PASS"

      - name: Copiar a tv.apk (nombre estable)
        id: apk
        run: |
          set -e
          ORIGEN=native/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p downloads
          # URL pública: siempre downloads/tv.apk. El nombre versionado solo
          # sirve como artefacto interno de CI, no se lo des al usuario.
          cp "$ORIGEN" tv.apk
          cp "$ORIGEN" android.apk
          cp "$ORIGEN" downloads/tv.apk
          cp "$ORIGEN" downloads/android.apk
          DESTINO="streambox-tv-${{ steps.ver.outputs.name }}.apk"
          cp "$ORIGEN" "$DESTINO"
          ls -lh tv.apk downloads/tv.apk "$DESTINO"
          echo "nombre=$DESTINO" >> "$GITHUB_OUTPUT"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT" dump badging tv.apk | grep -Ei "leanback|banner|package:|sdkVersion" || true
          unzip -l tv.apk | grep -Ei "exoplayer|media3|libvlc|VlcPlayer|PlayerActivity|StreamBoxPlugin" || true

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nombre }}
          path: |
            tv.apk
            android.apk
            downloads/tv.apk
          retention-days: 90

      - name: Guardar downloads/tv.apk en main
        continue-on-error: true
        run: |
          set -e
          cp tv.apk "$RUNNER_TEMP/tv.apk"
          git fetch origin main
          git checkout -B apk-slot origin/main
          mkdir -p downloads
          cp "$RUNNER_TEMP/tv.apk" downloads/tv.apk
          cp "$RUNNER_TEMP/tv.apk" downloads/android.apk
          git add downloads/tv.apk downloads/android.apk
          if git diff --cached --quiet; then
            echo "APK idéntico, no hay commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar downloads/tv.apk (URL estable) [skip ci]"
          git push origin HEAD:main

      - name: Publicar la clave nueva (guárdala como secreto KEYSTORE_BASE64)
        if: steps.firma.outputs.generada == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: clave-de-firma-GUARDAR-COMO-SECRETO
          path: ${{ runner.temp }}/keystore-base64.txt
          retention-days: 7

      - name: Adjuntar el APK a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tv.apk
            android.apk
          body: |
            Instalar siempre desde la misma URL (Downloader en Fire Stick):

            **https://acortador.vip/player/downloads/tv.apk**

            No uses el nombre versionado de GitHub. El APK de dentro cambia de versión; la dirección no.
            El mismo archivo sirve para Fire Stick / Android TV y para el móvil Android (ExoPlayer).

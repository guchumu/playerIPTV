name: APK Android TV y Android

# Compila DOS APKs en GitHub (sin Android Studio local):
#   downloads/tv.apk      → Android TV / Google Streamer (LibVLC en :vlc)
#   downloads/android.apk → teléfono (ExoPlayer, PiP, Chromecast)
#
# Lanzarlo a mano: Actions → "APK Android TV y Android" → Run workflow.
# Con etiqueta vNNN se adjunta a la Release.
#
# URLs públicas fijas:
#   https://acortador.vip/player/downloads/tv.apk
#   https://acortador.vip/player/downloads/android.apk

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "native/**"
      - "tools/patch_android_tv.py"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Capacitor
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Generar el proyecto Android
        working-directory: native
        run: npx cap add android

      - name: Numerar la versión
        id: ver
        working-directory: native/android/app
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$NAME\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Preparar la clave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          RUTA="$RUNNER_TEMP/streambox.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUTA"
            echo "usando la clave guardada en los secretos"
            echo "generada=no" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v -keystore "$RUTA" \
              -alias streambox -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass streambox -keypass streambox \
              -dname "CN=StreamBox IPTV, OU=Casa, O=StreamBox, L=Madrid, C=ES"
            base64 -w0 "$RUTA" > "$RUNNER_TEMP/keystore-base64.txt"
            echo "clave nueva generada"
            echo "generada=si" >> "$GITHUB_OUTPUT"
          fi
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"

      - name: Compilar APK TV (LibVLC, proceso :vlc)
        working-directory: native
        env:
          CLAVE: ${{ steps.firma.outputs.ruta }}
          CLAVE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'streambox' }}
          CLAVE_ALIAS: ${{ secrets.KEY_ALIAS || 'streambox' }}
          CLAVE_ALIAS_PASS: ${{ secrets.KEY_PASSWORD || 'streambox' }}
        run: |
          python3 ../tools/patch_android_tv.py android tv
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$CLAVE" \
            -Pandroid.injected.signing.store.password="$CLAVE_PASS" \
            -Pandroid.injected.signing.key.alias="$CLAVE_ALIAS" \
            -Pandroid.injected.signing.key.password="$CLAVE_ALIAS_PASS")
          mkdir -p "$RUNNER_TEMP/apks"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apks/tv.apk"

      - name: Compilar APK Android (ExoPlayer, PiP)
        working-directory: native
        env:
          CLAVE: ${{ steps.firma.outputs.ruta }}
          CLAVE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'streambox' }}
          CLAVE_ALIAS: ${{ secrets.KEY_ALIAS || 'streambox' }}
          CLAVE_ALIAS_PASS: ${{ secrets.KEY_PASSWORD || 'streambox' }}
        run: |
          python3 ../tools/patch_android_tv.py android mobile
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$CLAVE" \
            -Pandroid.injected.signing.store.password="$CLAVE_PASS" \
            -Pandroid.injected.signing.key.alias="$CLAVE_ALIAS" \
            -Pandroid.injected.signing.key.password="$CLAVE_ALIAS_PASS")
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apks/android.apk"

      - name: Copiar a nombres estables
        id: apk
        run: |
          set -e
          mkdir -p downloads
          cp "$RUNNER_TEMP/apks/tv.apk" tv.apk
          cp "$RUNNER_TEMP/apks/android.apk" android.apk
          cp tv.apk downloads/tv.apk
          cp android.apk downloads/android.apk
          DESTINO="streambox-tv-${{ steps.ver.outputs.name }}.apk"
          cp tv.apk "$DESTINO"
          echo "nombre=$DESTINO" >> "$GITHUB_OUTPUT"
          ls -lh tv.apk android.apk downloads/tv.apk downloads/android.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          echo "===== TV ====="
          "$AAPT" dump badging tv.apk | grep -Ei "leanback|banner|package:|sdkVersion" || true
          echo "===== ANDROID ====="
          "$AAPT" dump badging android.apk | grep -Ei "leanback|banner|package:|sdkVersion|pip" || true

      - name: Publicar los APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nombre }}
          path: |
            tv.apk
            android.apk
            downloads/tv.apk
            downloads/android.apk
          retention-days: 90

      - name: Guardar APKs en main
        continue-on-error: true
        run: |
          set -e
          cp tv.apk "$RUNNER_TEMP/tv.apk"
          cp android.apk "$RUNNER_TEMP/android.apk"
          git fetch origin main
          git checkout -B apk-slot origin/main
          mkdir -p downloads
          cp "$RUNNER_TEMP/tv.apk" downloads/tv.apk
          cp "$RUNNER_TEMP/android.apk" downloads/android.apk
          git add downloads/tv.apk downloads/android.apk
          if git diff --cached --quiet; then
            echo "APKs idénticos, no hay commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar downloads/tv.apk y android.apk (URLs estables) [skip ci]"
          git push origin HEAD:main

      - name: Publicar la clave nueva (guárdala como secreto KEYSTORE_BASE64)
        if: steps.firma.outputs.generada == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: clave-de-firma-GUARDAR-COMO-SECRETO
          path: ${{ runner.temp }}/keystore-base64.txt
          retention-days: 7

      - name: Adjuntar los APK a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tv.apk
            android.apk
          body: |
            Dos APKs. Las URLs no cambian al publicar otra versión:

            **Android TV / Google Streamer / Fire Stick**
            https://acortador.vip/player/downloads/tv.apk
            Solo carga remota (QR + Device ID). LibVLC en proceso aparte (no congela el Streamer).

            **Android teléfono / tablet**
            https://acortador.vip/player/downloads/android.apk
            Lista a mano o QR, PiP y Chromecast. ExoPlayer.

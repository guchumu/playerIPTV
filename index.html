<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>StreamBox IPTV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreamBox">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css?v=20260817j" />
    <link rel="manifest" href="manifest.json" />
</head>
<body>
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <img src="logo.png" alt="" class="login-logo" />
            <h1>StreamBox IPTV</h1>
            <p class="build-tag">v20260817j</p>

            <div class="remote-upload-box">
                <p>Carga tu lista desde el móvil en:</p>
                <div class="upload-url" id="uploadUrlDisplay">upload.php</div>
                <p>Tu código de dispositivo (Device ID):</p>
                <div id="deviceIdDisplay" class="device-id">Cargando...</div>
            </div>

            <div class="login-divider">— O ESCRÍBELA MANUALMENTE —</div>

            <form id="loginForm" autocomplete="on">
                <div class="input-group">
                    <label>Acceso Xtream Codes</label>
                    <input type="text" id="serverUrl" name="serverUrl" placeholder="http://servidor.com:8080" autocomplete="url" />
                    <input type="text" id="username" name="username" placeholder="Usuario" autocomplete="username" />
                    <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" />
                </div>
                <div class="login-divider">— O BIEN —</div>
                <div class="input-group">
                    <label>Lista M3U Directa</label>
                    <input type="text" id="m3uUrl" name="m3uUrl" placeholder="http://servidor.com:8080/get.php?..." />
                </div>
                <button type="submit" id="loginSubmitBtn">Cargar Contenido</button>
                <div id="loginError" class="error"></div>
            </form>
            <div id="globalSpinner" class="global-spinner" hidden aria-live="polite">
                <div class="spinner"></div>
                <p id="globalSpinnerText">Cargando...</p>
                <button type="button" id="spinnerCancelBtn" class="spinner-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="mainScreen" class="screen">
        <header class="compact-header">
            <div class="header-left"><h1>StreamBox IPTV</h1></div>
            <div class="header-right">
                <span id="accountExpiryLabel"></span>
                <span id="headerUser"></span>
                <label class="buffer-control" title="Segundos de buffer del directo">
                    Buffer
                    <select id="bufferSelect">
                        <option value="8">8s</option>
                        <option value="15" selected>15s</option>
                        <option value="30">30s</option>
                        <option value="60">60s</option>
                        <option value="90">90s</option>
                    </select>
                </label>
                <label class="track-control" id="audioTrackWrap" hidden>
                    Audio
                    <select id="audioTrackSelect"></select>
                </label>
                <label class="track-control" id="subtitleTrackWrap" hidden>
                    Subs
                    <select id="subtitleTrackSelect"></select>
                </label>
                <button id="aspectBtn" class="action-btn" type="button" title="Ajuste de imagen">🖼</button>
                <button id="pipBtn" class="action-btn" type="button" title="Picture-in-Picture" hidden>▢</button>
                <button id="airplayBtn" class="action-btn" type="button" title="AirPlay" hidden>📡</button>
                <button id="refreshBtn" class="action-btn" type="button" title="Refrescar lista">🔄</button>
                <button id="castButton" class="action-btn" type="button" title="Chromecast" hidden>📺</button>
                <button id="logoutBtn" class="action-btn" type="button" title="Salir">⏻</button>
            </div>
        </header>

        <div class="main-container">
            <aside class="categories-column">
                <div id="categoriesContainer" class="categories-list"></div>
            </aside>

            <section class="channels-column">
                <h2 id="channelColumnTitle">Canales</h2>
                <div id="channelsContainer" class="channels-list"></div>
            </section>

            <section class="player-column">
                <div class="video-wrapper">
                    <video id="videoPlayer" playsinline webkit-playsinline controls style="width: 100%; height: 100%; touch-action: manipulation;"></video>
                    <div id="spinner" class="spinner-overlay"><div class="spinner"></div></div>
                    <div id="gestureHint" class="gesture-hint" hidden>
                        <span id="gestureIcon" class="gesture-icon">☀</span>
                        <div class="gesture-bar"><i id="gestureFill"></i></div>
                        <span id="gestureValue" class="gesture-value">50%</span>
                    </div>
                </div>

                <div class="epg-container">
                    <div class="epg-header"><span>AHORA</span><span>DESPUÉS</span></div>
                    <div class="epg-info">
                        <div id="epgNow" class="epg-now">--:--</div>
                        <div id="epgNext" class="epg-next">--:--</div>
                    </div>
                </div>

                <div class="epg-timeline-box">
                    <div class="epg-timeline-title" id="epgTimelineTitle">Guía del canal</div>
                    <div class="epg-timeline" id="epgTimeline"></div>
                </div>
            </section>
        </div>
    </div>

    <div id="appToast" class="app-toast" hidden></div>

    <div id="debugOverlay" class="debug-overlay" hidden>
        <div class="debug-panel">
            <div class="debug-header">
                <strong>Modo debug</strong>
                <div>
                    <button type="button" id="debugCopyBtn">Copiar</button>
                    <button type="button" id="debugCloseBtn">Cerrar</button>
                </div>
            </div>
            <pre id="debugOutput"></pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script src="core.js?v=20260817j"></script>
</body>
</html>
